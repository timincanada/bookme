<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BookMe</title>
<style>
  :root { --paper: #faf8f3; --ink: #1f2a24; --forest: #154734; --muted: #6b6f68; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif; }
  main { min-height: 100%; display: flex; flex-direction: column; justify-content: center;
    padding: 32px; box-sizing: border-box; max-width: 420px; margin: 0 auto; }
  .mark { width: 56px; height: 56px; border-radius: 14px; background: var(--forest); color: var(--paper);
    display: grid; place-items: center; font-size: 30px; }
  h1 { font-weight: 500; font-size: 32px; margin: 28px 0 8px; }
  p { font-family: -apple-system, system-ui, sans-serif; color: var(--muted); line-height: 1.5; margin: 0; }
  button { margin-top: 28px; height: 48px; border: 0; border-radius: 12px; background: var(--forest);
    color: var(--paper); font: 600 16px -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <div class="mark">B</div>
  <h1>You're offline</h1>
  <p>BookMe needs a connection to load your schedule and messages. Check your connection and try again.</p>
  <button type="button" onclick="location.href='https://bookme.training/welcome'">Try again</button>
</main>
</body>
</html>

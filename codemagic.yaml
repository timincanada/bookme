# Codemagic: signed iOS (App Store Connect) and Android (Play) builds.
# Set up in Codemagic: App Store Connect API key integration "bookme_asc",
# Android keystore "bookme_upload", and the env groups referenced below.
workflows:
  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: bookme_asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.bookme.training
    scripts:
      - name: Install
        script: npm ci
      - name: Sync
        script: npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App \
            --build-version "$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android release
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      android_signing:
        - bookme_upload
      groups:
        - firebase # GOOGLE_SERVICES_JSON
    scripts:
      - name: Install
        script: npm ci
      - name: Firebase config
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
      - name: Sync
        script: npx cap sync android
      - name: Build
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab

  # ---------------------------------------------------------------------------
  # Compile checks: no Apple account, no signing, nothing uploaded.
  # Use these to prove the two Xcode projects build. Run them manually.
  # ---------------------------------------------------------------------------
  ios-compile-check:
    name: iOS compile check (coach, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install
        script: npm ci
      - name: Sync
        script: npx cap sync ios
      - name: Build (no signing)
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  ios-student-compile-check:
    name: iOS compile check (student, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install
        script: npm ci
      - name: Sync
        script: npm run mobile:sync:student
      - name: Build (no signing)
        script: |
          xcodebuild -project ios-student/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  android-compile-check:
    name: Android compile check (coach, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install
        script: npm ci
      - name: Sync
        script: npx cap sync android
      - name: Build debug
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-student-compile-check:
    name: Android compile check (student, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install
        script: npm ci
      - name: Sync
        script: npm run mobile:sync:student -- android
      - name: Build debug
        script: cd android-student && ./gradlew assembleDebug
    artifacts:
      - android-student/app/build/outputs/**/*.apk
